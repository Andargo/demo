<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Casa Boscana · Reel</title>
<style>
  @font-face { font-family: "Instrument Serif"; font-style: italic; src: url(assets/fonts/InstrumentSerif-Italic.woff2) format("woff2"); }
  @font-face { font-family: "Instrument Serif"; font-style: normal; src: url(assets/fonts/InstrumentSerif-Regular.woff2) format("woff2"); }

  :root { --cream: #f6ecdf; --terra: #c8643c; --ink: #0d0a08; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; background: var(--ink); overflow: hidden; }
  body { font-family: "Inter", sans-serif; color: var(--cream); }

  .stage { position: absolute; inset: 0; overflow: hidden; }
  .layer { position: absolute; inset: 0; opacity: 0; will-change: transform, opacity, clip-path; }
  .layer img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shade { position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(13,10,8,.78) 0%, rgba(13,10,8,.15) 30%, rgba(13,10,8,0) 55%, rgba(13,10,8,.55) 100%); }

  /* Barra superior tipo "Web Lab" */
  .topbar { position: absolute; top: 90px; left: 70px; right: 70px; display: flex; justify-content: space-between;
    font: 500 24px/1 "DejaVu Sans Mono", monospace; letter-spacing: .32em; color: rgba(246,236,223,.75); z-index: 20; }

  .headline { position: absolute; left: 70px; right: 70px; top: 190px; z-index: 20;
    font: 600 104px/1.02 "Inter Display", "Inter", sans-serif; letter-spacing: -.035em; text-shadow: 0 4px 40px rgba(0,0,0,.45); }
  .headline em { font: italic 400 122px/1 "Instrument Serif", serif; letter-spacing: -.01em; color: #ffd9a8; }
  .headline .w { display: inline-block; opacity: 0; }

  .tag { position: absolute; left: 70px; z-index: 20; font: 500 26px/1 "DejaVu Sans Mono", monospace;
    letter-spacing: .3em; color: rgba(246,236,223,.85); opacity: 0; }

  .chips { position: absolute; left: 70px; right: 140px; top: 1180px; display: flex; flex-direction: column; gap: 22px; z-index: 20; }
  .chip { align-self: flex-start; padding: 22px 34px; border-radius: 22px; font: 600 44px/1 "Inter", sans-serif;
    background: rgba(13,10,8,.55); border: 1.5px solid rgba(246,236,223,.35); backdrop-filter: blur(14px); opacity: 0; }

  .route { position: absolute; left: 70px; right: 140px; top: 1220px; z-index: 20; opacity: 0; padding: 40px 40px 36px;
    border-radius: 28px; background: rgba(13,10,8,.58); border: 1.5px solid rgba(246,236,223,.25); backdrop-filter: blur(16px); }
  .route .labels { display: flex; justify-content: space-between; font: 600 40px/1 "Inter"; margin-bottom: 26px; }
  .route .bar { height: 14px; border-radius: 7px; background: rgba(246,236,223,.22); overflow: hidden; }
  .route .fill { height: 100%; width: 0; border-radius: 7px; background: linear-gradient(90deg, #f6ecdf, #ffd9a8); }
  .route .time { margin-top: 26px; font: 500 26px/1 "DejaVu Sans Mono", monospace; letter-spacing: .3em; color: rgba(246,236,223,.8); }

  /* Intro y cierre */
  .card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; opacity: 0; z-index: 30;
    background: radial-gradient(ellipse at 50% 55%, #3a2214 0%, #160e09 55%, #0d0a08 100%); }
  .logo-ring { width: 210px; height: 210px; border-radius: 50%; background: var(--terra); display: grid; place-items: center;
    box-shadow: 0 0 120px rgba(200,100,60,.45); margin-bottom: 70px; }
  .logo-ring svg { width: 130px; }
  .brand { font: 400 150px/1 "Instrument Serif", serif; letter-spacing: -.01em; }
  .brand .l { display: inline-block; opacity: 0; }
  .sub { margin-top: 34px; font: 500 28px/1 "DejaVu Sans Mono", monospace; letter-spacing: .42em; color: rgba(246,236,223,.7); opacity: 0; }

  .end .stars { font: 600 46px/1 "Inter"; color: #ffd9a8; margin-bottom: 40px; opacity: 0; }
  .end .big { font: 600 96px/1.04 "Inter Display", "Inter"; letter-spacing: -.035em; opacity: 0; }
  .end .big em { font: italic 400 116px/1 "Instrument Serif", serif; color: #ffd9a8; }
  .end .cta { margin-top: 70px; padding: 30px 46px; border-radius: 26px; background: var(--cream); color: var(--ink);
    font: 600 40px/1 "Inter"; opacity: 0; }
  .end .handle { margin-top: 40px; font: 500 28px/1 "DejaVu Sans Mono", monospace; letter-spacing: .3em; color: rgba(246,236,223,.7); opacity: 0; }

  .glow { position: absolute; inset: 0; z-index: 25; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 66%, rgba(255,200,120,.75), rgba(255,170,90,0) 55%); mix-blend-mode: screen; }
  .vignette { position: absolute; inset: 0; z-index: 40; pointer-events: none;
    box-shadow: inset 0 0 260px rgba(0,0,0,.55); }
</style>
</head>
<body>
<div class="stage">
  <div class="layer" id="L-clay"><img src="assets/plastilina.png"></div>
  <div class="layer" id="L-illu"><img src="assets/ilustracion.png"></div>
  <div class="layer" id="L-real"><img src="assets/real-fogata.jpg" style="object-position: 52% 50%"></div>
  <div class="layer" id="L-path"><img src="assets/real-sendero.jpg" style="object-position: 40% 50%"></div>
  <div class="layer" id="L-terr"><img src="assets/real-terraza.jpg" style="object-position: 30% 50%"></div>
  <div class="shade"></div>
  <div class="glow" id="glow"></div>

  <div class="topbar" id="topbar"><span>CASA BOSCANA</span><span>BOYACÁ · CO</span></div>

  <div class="headline" id="h1"></div>
  <div class="tag" id="tag"></div>

  <div class="chips" id="chips">
    <div class="chip">Jacuzzi con vista</div>
    <div class="chip">Fogata &amp; BBQ</div>
    <div class="chip">Pet friendly 🐶</div>
  </div>

  <div class="route" id="route">
    <div class="labels"><span>Bogotá</span><span>Guateque, Boyacá</span></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="time" id="rtime">0H 00MIN</div>
  </div>

  <div class="card" id="intro">
    <div class="logo-ring">
      <svg viewBox="0 0 120 80" fill="none" stroke="#f6ecdf" stroke-width="4" stroke-linecap="round">
        <path d="M12 70 H108"/><path d="M30 70 V38 H96 V70"/><path d="M20 40 Q60 0 104 40"/>
        <path d="M16 30 l6 -12 l6 12 M18 24 h8" stroke-width="3"/><circle cx="70" cy="22" r="6" fill="#f6ecdf" stroke="none"/>
      </svg>
    </div>
    <div class="brand" id="brand"></div>
    <div class="sub" id="sub">ESCAPE A LA NATURALEZA</div>
  </div>

  <div class="card end" id="end">
    <div class="stars" id="stars">★★★★★ &nbsp;Superhost</div>
    <div class="big" id="endbig">Tu refugio<br>te <em>espera.</em></div>
    <div class="cta" id="cta">airbnb.com/h/casaboscana</div>
    <div class="handle" id="handle">@CASABOSCANA</div>
  </div>
  <div class="vignette"></div>
</div>

<script>
// ---------- utilidades ----------
const DURATION = 25;
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const fade = (t, a, b, c, d) => Math.min(easeOut(prog(t, a, b)), 1 - easeInOut(prog(t, c, d)));

// ---------- textos animados palabra por palabra ----------
const SCENES = [
  { from: 3.0,  to: 6.8,  html: 'Primero lo <em>soñamos.</em>' },
  { from: 7.0,  to: 9.8,  html: 'Luego lo <em>dibujamos.</em>' },
  { from: 10.6, to: 14.3, html: 'Hoy es <em>real.</em>' },
  { from: 14.8, to: 18.3, html: 'Refugio para <em>dos</em> entre montañas.' },
  { from: 18.6, to: 21.4, html: 'A dos horas de <em>todo.</em>' },
];
function words(html) {
  return html.replace(/(<em>.*?<\/em>|[^\s<]+)/g, m => `<span class="w">${m}</span>`);
}
let currentScene = -1;
function renderHeadline(t) {
  const i = SCENES.findIndex(s => t >= s.from - .01 && t < s.to);
  const h = $('h1');
  if (i !== currentScene) { h.innerHTML = i >= 0 ? words(SCENES[i].html) : ''; currentScene = i; }
  if (i < 0) return;
  const s = SCENES[i];
  h.querySelectorAll('.w').forEach((w, k) => {
    const p = easeOut(prog(t, s.from + k * .12, s.from + k * .12 + .55));
    const out = easeInOut(prog(t, s.to - .45, s.to));
    w.style.opacity = p * (1 - out);
    w.style.transform = `translateY(${(1 - p) * 60 - out * 30}px)`;
    w.style.filter = `blur(${(1 - p) * 14 + out * 10}px)`;
  });
}

const TAGS = [
  { from: 3.4,  to: 6.8,  text: 'V.01 — EN PLASTILINA' },
  { from: 7.4,  to: 9.8,  text: 'V.02 — ILUSTRACIÓN' },
  { from: 11.2, to: 14.3, text: 'V.03 — GUATEQUE, BOYACÁ' },
];
function renderTag(t) {
  const tag = $('tag');
  const s = TAGS.find(s => t >= s.from && t < s.to);
  if (!s) { tag.style.opacity = 0; return; }
  tag.textContent = s.text;
  tag.style.top = '470px';
  tag.style.opacity = fade(t, s.from, s.from + .5, s.to - .4, s.to);
}

// ---------- capas de imagen con movimiento de cámara ----------
function kb(el, op, scale, x = 0, y = 0) {
  el.style.opacity = op;
  el.style.transform = `scale(${scale}) translate(${x}px, ${y}px)`;
}

function render(t) {
  // Intro
  const intro = $('intro');
  intro.style.opacity = 1 - easeInOut(prog(t, 2.5, 3.1));
  const brand = $('brand');
  if (!brand.children.length) brand.innerHTML = [...'Casa Boscana'].map(c => `<span class="l">${c === ' ' ? '&nbsp;' : c}</span>`).join('');
  [...brand.children].forEach((l, k) => {
    const p = easeOut(prog(t, .25 + k * .05, .85 + k * .05));
    l.style.opacity = p; l.style.transform = `translateY(${(1 - p) * 40}px)`; l.style.filter = `blur(${(1 - p) * 10}px)`;
  });
  intro.querySelector('.logo-ring').style.transform = `scale(${.6 + .4 * easeOut(prog(t, 0, .8))})`;
  intro.querySelector('.logo-ring').style.opacity = easeOut(prog(t, 0, .6));
  $('sub').style.opacity = easeOut(prog(t, 1.2, 1.8));

  // Plastilina → ilustración → foto real
  kb($('L-clay'), t < 9.5 ? 1 : 0, 1.12 - .08 * prog(t, 2.6, 7.6));
  kb($('L-illu'), easeInOut(prog(t, 6.6, 7.6)) * (t < 11.2 ? 1 : 0), 1.10 - .06 * prog(t, 6.6, 10.6));

  const real = $('L-real');
  const r = easeInOut(prog(t, 9.8, 11.0));
  real.style.clipPath = `circle(${r * 130}% at 50% 66%)`;
  kb(real, (t >= 9.8 && t < 15.6) ? 1 : 0, 1.16 - .1 * prog(t, 9.8, 15.0));
  $('glow').style.opacity = Math.sin(Math.PI * prog(t, 9.7, 11.4)) * .9;

  // Sendero (cumple: refugio para dos + chips)
  kb($('L-path'), easeInOut(prog(t, 14.4, 15.2)) * (t < 19 ? 1 : 0), 1.04 + .08 * prog(t, 14.4, 18.8), 0, -20 * prog(t, 14.4, 18.8));
  [...$('chips').children].forEach((c, k) => {
    const a = 15.8 + k * .35;
    const p = easeOut(prog(t, a, a + .5));
    const out = easeInOut(prog(t, 18.0, 18.4));
    c.style.opacity = p * (1 - out);
    c.style.transform = `translateX(${(1 - p) * -80}px)`;
  });

  // Terraza (ruta Bogotá → Guateque)
  kb($('L-terr'), easeInOut(prog(t, 18.4, 19.2)) * (t < 22 ? 1 : 0), 1.12 - .07 * prog(t, 18.4, 21.8), 20 * prog(t, 18.4, 21.8));
  const route = $('route');
  route.style.opacity = fade(t, 19.2, 19.6, 21.0, 21.4);
  const fp = easeInOut(prog(t, 19.4, 20.8));
  $('fill').style.width = `${fp * 100}%`;
  const mins = Math.round(fp * 120);
  $('rtime').textContent = `${Math.floor(mins / 60)}H ${String(mins % 60).padStart(2, '0')}MIN EN CARRO`;

  // Cierre
  const end = $('end');
  end.style.opacity = easeInOut(prog(t, 21.4, 22.0));
  $('stars').style.opacity = easeOut(prog(t, 21.9, 22.4));
  $('endbig').style.opacity = easeOut(prog(t, 22.1, 22.7));
  $('endbig').style.transform = `translateY(${(1 - easeOut(prog(t, 22.1, 22.7))) * 40}px)`;
  const c = easeOut(prog(t, 22.6, 23.1));
  $('cta').style.opacity = c; $('cta').style.transform = `scale(${.9 + .1 * c})`;
  $('handle').style.opacity = easeOut(prog(t, 23.0, 23.5));

  $('topbar').style.opacity = prog(t, 3, 3.5) * (1 - prog(t, 21.2, 21.6));
  renderHeadline(t);
  renderTag(t);
}

window.DURATION = DURATION;
window.seek = t => render(t);

// Vista previa en navegador: reproduce en bucle si no se controla externamente
if (!new URLSearchParams(location.search).has('render')) {
  const start = performance.now();
  (function loop(now) { render(((now - start) / 1000) % DURATION); requestAnimationFrame(loop); })(start);
} else {
  render(0);
}
</script>
</body>
</html>
